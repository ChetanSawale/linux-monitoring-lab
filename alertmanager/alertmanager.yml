# Alertmanager routing for the monitoring lab.
# Everything lands on the local webhook receiver (alert-receiver:5001),
# which appends each notification to alert-receiver/data/alerts.log.
# To page a real channel later, add a receiver (email/slack) here — see README.
global:
  resolve_timeout: 5m

route:
  receiver: 'webhook'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'webhook'
      continue: true

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://alert-receiver:5001/webhook'
        send_resolved: true

inhibit_rules:
  # If the whole instance is down, suppress its warning-level noise.
  - source_matchers:
      - severity = "critical"
      - alertname = "InstanceDown"
    target_matchers:
      - severity = "warning"
    equal: ['instance']
